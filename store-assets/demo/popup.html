<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --ink:#1f2328; --sub:#59636e; --line:#d1d9e0; --accent:#0969da; --ok:#1a7f37; --err:#cf222e; color-scheme: light; }
  :root[data-theme=dark] { color-scheme: dark; --bg:#0d1117; --ink:#e6edf3; --sub:#9198a1; --line:#3d444d; --accent:#4493f8; --ok:#3fb950; --err:#f85149; }
  [hidden] { display:none !important; }
  body { margin:0; width:340px; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:600; }
  header img { width:20px; height:20px; }
  section { padding:12px 14px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  section:last-child { border-bottom:0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sub { color:var(--sub); font-size:12px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  button { font:inherit; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  select, input[type=number] { font:inherit; padding:3px 6px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); }
  input[type=number] { width:70px; }
  .switch { position:relative; width:34px; height:20px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; border-radius:10px; background:var(--line); transition:.15s; cursor:pointer; }
  .switch span::after { content:""; position:absolute; left:2px; top:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; }
  .switch input:checked + span { background:var(--accent); }
  .switch input:checked + span::after { transform:translateX(14px); }
  code { font-size:11px; word-break:break-all; }
  .cmd { display:grid; grid-template-columns:1fr auto; gap:4px 8px; align-items:center; margin-top:6px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .cmd .tool { font-size:11px; color:var(--sub); }
  .cmd button { grid-row:1; grid-column:2; }
  .cmd code { grid-column:1 / -1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; word-break:normal; }
  .steps { margin:0; padding-left:18px; display:grid; gap:10px; }
  .steps li > span { display:block; margin-bottom:4px; }
  .cmd button { padding:2px 8px; font-size:12px; }
</style>
</head>
<body>
<header><img src="/icons/icon32.png" alt=""><span data-i18n="title">Gerrit Lens</span></header>
<section>
  <div class="row"><span data-i18n="enabled">새 화면 사용</span><label class="switch"><input id="enabled" type="checkbox"><span></span></label></div>
  <div class="row"><span data-i18n="theme">테마</span>
    <select id="theme"><option value="light" data-i18n="themeLight">라이트</option><option value="dark" data-i18n="themeDark">다크</option></select>
  </div>
  <div class="row"><span data-i18n="language">언어</span>
    <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select>
  </div>
</section>
<section id="site">
  <div class="sub" id="site-text"></div>
  <button id="site-btn" class="primary" hidden></button>
</section>
<section>
  <div class="row"><b data-i18n="bridge">AI 의견 (선택)</b><span id="bridge-state" class="sub"></span></div>
  <div class="sub" data-i18n="bridgeWhat"></div>
  <ol id="bridge-guide" class="steps" hidden>
    <li><span data-i18n="bridgeStep1"></span>
      <div class="cmd"><span class="tool">Claude Code</span><button data-i18n="copy">복사</button><code>claude mcp add --scope user gerrit-lens -- npx -y gerrit-lens-bridge</code></div>
      <div class="cmd"><span class="tool">Codex</span><button data-i18n="copy">복사</button><code>codex mcp add gerrit-lens -- npx -y gerrit-lens-bridge</code></div>
    </li>
    <li><span data-i18n="bridgeStep2"></span>
      <div><button id="bridge-btn" class="primary" hidden data-i18n="bridgeGrant">연결 허용</button><span id="bridge-granted" class="ok" hidden>&#10003;</span></div>
    </li>
  </ol>
  <div id="bridge-done" class="sub" data-i18n="bridgeStep3" hidden></div>
</section>
<script>
// Store screenshot stub: popup on an enabled Gerrit site.
const q = new URLSearchParams(location.search);
window.chrome = {
  storage: { local: { get: async (d) => ({ ...d, sites: ['https://gerrit.example.com'], lang: q.get('lang') || 'ko', theme: 'light' }), set: async () => {} } },
  tabs: { query: async () => [{ id: 1, url: 'https://gerrit.example.com/c/acme/web-app/+/1042' }], reload() {} },
  // Site allowed, bridge not set up yet: the popup shows the two setup steps.
  permissions: { contains: async ({ origins }) => !origins[0].includes('127.0.0.1'), request: async () => true, remove: async () => true },
  runtime: { sendMessage: async (m) => ({ ok: m.type !== 'lens:bridge-ping' }) },
};
</script>
<script src="/core.js"></script>
<script src="/popup.js"></script>
</body>
</html>
